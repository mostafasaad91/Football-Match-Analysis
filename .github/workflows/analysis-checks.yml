name: Analysis invariants
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      # Naming ten files by hand is how the headline regression shipped. The
      # suite that caught it — 55 fixtures sharing one sentence — was written,
      # committed, and never run here, because it was not on the list. The
      # whole suite runs now, minus the slow package builds, so a test only
      # has to exist to be gating.
      - run: python -m pytest tests -q -m "not slow"
